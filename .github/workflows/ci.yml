name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only the newest run of a pull request matters. Pushes to main get a group each
# (the run ID): a shared group would cancel a waiting run when the next one queues.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Same major as the Dockerfile.
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      # No API is reachable here; every page that fetches is rendered on demand.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
