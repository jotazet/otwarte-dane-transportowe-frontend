name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only the newest run of a pull request matters. Pushes to main get a group each
# (the run ID): a shared group would cancel a waiting run when the next one queues.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Same major as the Dockerfile.
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      # No API is reachable here; every page that fetches is rendered on demand.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
